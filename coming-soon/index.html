<script>
  /* Hide-until-animated states apply only when motion is allowed AND the libraries are present. */
  (function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) document.documentElement.classList.add('anim');
    setTimeout(function () { document.documentElement.classList.remove('anim'); }, 9000); /* failsafe */
  })();

<style>
  :root {
    color-scheme: light;
    --bg: #f4f8fb;          /* identical to the logo's flattened backdrop */
    --navy: #14324b;
    --teal: #1fa79f;
    --teal-deep: #157f7a;
    --mute: #566b7d;
    --line: #d3dde6;
    --font: 'Montserrat', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    font-family: var(--font);
    color: var(--navy);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Three.js layer */
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: env(safe-area-inset-top, 0px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-block: clamp(24px, 6vh, 64px) clamp(24px, 4vh, 48px);
    gap: 0;
  }

  /* ---------- Logo (the original artwork, never restyled) ---------- */
  .logo-wrap {
    position: relative;
    width: min(94vw, 940px);
    line-height: 0;
  }
  .logo {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .scan {
    position: absolute;
    top: 12%;
    bottom: 12%;
    left: 0;
    width: 2px;
    border-radius: 2px;
    background: linear-gradient(to bottom, transparent, var(--teal) 25%, var(--teal) 75%, transparent);
    box-shadow: 0 0 18px 3px rgba(31, 167, 159, .45);
    opacity: 0;
    pointer-events: none;
  }

  /* ---------- Copy ---------- */
  h1 {
    margin: clamp(8px, 2vh, 20px) 0 0;
    font-weight: 300;
    font-size: clamp(1.55rem, 1rem + 2.6vw, 2.75rem);
    line-height: 1.18;
    letter-spacing: -0.015em;
    color: var(--navy);
    max-width: 20ch;
    text-wrap: balance;
  }
  .word { display: inline-block; white-space: nowrap; }
  .ch { display: inline-block; will-change: transform, opacity; }

  .lede {
    margin: 18px 0 0;
    max-width: 52ch;
    font-size: clamp(.95rem, .9rem + .25vw, 1.05rem);
    line-height: 1.7;
    color: var(--mute);
    font-weight: 400;
    text-wrap: pretty;
  }

  /* ---------- Countdown ---------- */
  .countdown {
    margin: clamp(28px, 5vh, 48px) 0 0;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  .unit {
    position: relative;
    min-width: clamp(64px, 17vw, 112px);
    padding: 0 clamp(8px, 2.4vw, 22px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .unit + .unit::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10%;
    bottom: 10%;
    width: 1px;
    background: var(--line);
  }
  .num-clip { overflow: hidden; line-height: 1.1; padding-block: 2px; }
  .num {
    display: block;
    font-size: clamp(1.9rem, 1.2rem + 3.6vw, 3.4rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--navy);
  }
  .unit-label {
    font-size: .8rem;
    font-weight: 500;
    color: var(--teal-deep);
    letter-spacing: .02em;
  }
  .signal { width: min(420px, 78vw); height: 24px; margin-top: 18px; overflow: visible; }
  .launch-note { margin: 10px 0 0; font-size: .85rem; color: var(--mute); }

  /* ---------- Notify form ---------- */
  .notify { margin-top: clamp(26px, 4.5vh, 40px); width: min(100%, 460px); }
  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, .86);
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(31, 167, 159, .16); }
  .field input {
    flex: 1;
    min-width: 0;
    height: 46px;
    padding: 0 18px;
    border: 0;
    background: transparent;
    font: 400 1rem/1 var(--font);
    color: var(--navy);
    outline: none;
  }
  .field input::placeholder { color: #7d90a0; }
  .field button {
    height: 46px;
    padding: 0 24px;
    border: 0;
    border-radius: 999px;
    background: var(--navy);
    color: #fff;
    font: 500 .95rem/1 var(--font);
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .field button:hover { background: var(--teal-deep); }
  .field button:disabled { opacity: .65; cursor: progress; }
  .notify-status { min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; color: var(--mute); }
  .notify-status[data-state="error"] { color: #b3261e; }
  .notify-status[data-state="ok"] { color: var(--teal-deep); }

  :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .field input:focus-visible { outline: none; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Footer ---------- */
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 20px;
    font-size: .8rem;
    color: var(--mute);
    text-align: center;
  }
  footer a { color: var(--navy); text-underline-offset: 3px; }
  footer a:hover { color: var(--teal-deep); }

  /* ---------- Initial animation states (only when libs + motion allowed) ---------- */
  .anim .logo { clip-path: inset(0 100% 0 0); }
  .anim .ch { opacity: 0; }
  .anim .reveal { opacity: 0; transform: translateY(14px); }

  @media (max-width: 520px) {
    .field { flex-direction: column; border-radius: 22px; padding: 8px; }
    .field input { width: 100%; text-align: center; }
    .field button { width: 100%; }
    .unit + .unit::before { top: 18%; bottom: 18%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

        var s = document.createElement('span');
        s.className = 'ch';
        s.textContent = c;
        w.appendChild(s);
      });
      h1.appendChild(w);
      if (i < arr.length - 1) h1.appendChild(document.createTextNode(' '));
    });
  }

  /* ---------- countdown (anime.js roll on change) ---------- */
  var nums = {
    days: $('[data-unit="days"]'), hours: $('[data-unit="hours"]'),
    minutes: $('[data-unit="minutes"]'), seconds: $('[data-unit="seconds"]')
  };
  var last = {};
  function pad(n) { return String(n).padStart(2, '0'); }

  function setNum(key, val, animateIt) {
    var el = nums[key];
    if (last[key] === val) return;
    last[key] = val;
    if (!animateIt) { el.textContent = val; return; }
    anime.remove(el);
    anime({
      targets: el, translateY: [0, '-100%'], opacity: [1, 0], duration: 180, easing: 'easeInQuad',
      complete: function () {
        el.textContent = val;
        anime({ targets: el, translateY: ['100%', 0], opacity: [0, 1], duration: 380, easing: 'easeOutExpo' });
      }
    });
  }

  var timer;
  function tick(first) {
    var diff = launchAt - Date.now();
    if (isNaN(launchAt) || diff <= 0) {
      clearInterval(timer);
      $('#countdown').innerHTML = '<p class="lede" style="margin:0">We\'re live. Welcome to the new NexPixels.</p>';
      $('#launch-note').textContent = '';
      return;
    }
    var s = Math.floor(diff / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600);  s -= h * 3600;
    var m = Math.floor(s / 60);    s -= m * 60;
    var a = animate && !first;
    setNum('days', pad(d), a); setNum('hours', pad(h), a);
    setNum('minutes', pad(m), a); setNum('seconds', pad(s), a);
  }
  tick(true);
  timer = setInterval(tick, 1000);

  /* ---------- notify form ---------- */
  var form = $('#notify'), emailEl = $('#email'), statusEl = $('#notify-status'), btn = $('#notify-btn');
  function say(msg, state) { statusEl.textContent = msg; statusEl.dataset.state = state || ''; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = emailEl.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      say('Enter a valid email address, for example name@company.com.', 'error');
      emailEl.focus();
      return;
    }
    if (!CONFIG.NOTIFY_ENDPOINT) {
      window.location.href = 'mailto:' + CONFIG.CONTACT_EMAIL +
        '?subject=' + encodeURIComponent('Notify me when NexPixels launches') +
        '&body=' + encodeURIComponent('Please notify me at ' + email + ' when the new website goes live.');
      say('Your email app should open with a ready-to-send message.', 'ok');
      return;
    }
    btn.disabled = true; say('Sending…');
    fetch(CONFIG.NOTIFY_ENDPOINT, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    }).then(function (r) {
      if (!r.ok) throw new Error('bad status');
      say('You\'re on the list. We\'ll email ' + email + ' at launch.', 'ok');
      form.reset();
      if (animate) anime({ targets: statusEl, translateY: [8, 0], opacity: [0, 1], duration: 500, easing: 'easeOutExpo' });
    }).catch(function () {
      say('Something went wrong. Please try again or email ' + CONFIG.CONTACT_EMAIL + '.', 'error');
    }).then(function () { btn.disabled = false; });
  });

  /* ======================= THREE.JS pixel field ======================= */
  var canvas = $('#scene');
  var renderer, scene, camera, floorMat, dustMat, FLOOR_Y = -2.2;
  var intro = { v: animate ? 0 : 1 };
  var pointer = { x: 0, y: 0, active: false, t: 0 };
  var mouseFloor = new THREE.Vector2(0, -6);
  var mouseTarget = new THREE.Vector2(0, -6);

  function initScene() {
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true, powerPreference: 'low-power' });
    } catch (err) { canvas.style.display = 'none'; return false; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 1.6, animate ? 12 : 9);

    /* floor of square "pixels" */
    var cols = 150, rows = 96, step = 0.34;
    var pos = new Float32Array(cols * rows * 3), k = 0;
    for (var j = 0; j < rows; j++) {
      for (var i = 0; i < cols; i++) {
        pos[k++] = (i - cols / 2) * step;
        pos[k++] = 0;
        pos[k++] = 5 - j * step;
      }
    }
    var fg = new THREE.BufferGeometry();
    fg.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    floorMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {
        uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uSize: { value: 2.3 },
        uMouse: { value: mouseFloor }, uIntro: { value: intro.v }
      },
      vertexShader: [
        'uniform float uTime; uniform float uPR; uniform float uSize; uniform vec2 uMouse;',
        'varying float vH; varying float vFade;',
        'void main(){',
        '  vec3 p = position;',
        '  float w = sin(p.x*0.35 + uTime*0.8)*0.34 + cos(p.z*0.30 + uTime*0.6)*0.34 + sin((p.x+p.z)*0.2 + uTime*0.4)*0.26;',
        '  float d = distance(p.xz, uMouse);',
        '  w += 0.85*exp(-d*d*0.22)*cos(d*3.0 - uTime*4.0);',
        '  p.y = w;',
        '  vH = w;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '  float dist = -mv.z;',
        '  gl_PointSize = uSize * uPR * (14.0 / dist);',
        '  vFade = (1.0 - smoothstep(14.0, 34.0, dist)) * (1.0 - smoothstep(13.0, 26.0, abs(p.x)));',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uIntro; varying float vH; varying float vFade;',
        'void main(){',
        '  vec3 navy = vec3(0.078, 0.196, 0.294);',
        '  vec3 teal = vec3(0.122, 0.655, 0.624);',
        '  float h = clamp(vH*0.55 + 0.5, 0.0, 1.0);',
        '  vec3 col = mix(navy, teal, h);',
        '  float a = vFade * (0.20 + 0.55*h) * uIntro;',
        '  gl_FragColor = vec4(col, a);',
        '}'
      ].join('\n')
    });
    var floor = new THREE.Points(fg, floorMat);
    floor.position.y = FLOOR_Y;
    scene.add(floor);

    /* rising dust */
    var n = 240, dp = new Float32Array(n * 3), seed = new Float32Array(n);
    for (var q = 0; q < n; q++) {
      dp[q * 3] = (Math.random() - 0.5) * 30;
      dp[q * 3 + 1] = Math.random() * 10;
      dp[q * 3 + 2] = -Math.random() * 16 + 2;
      seed[q] = Math.random();
    }
    var dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
    dg.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    dustMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uIntro: { value: intro.v } },
      vertexShader: [
        'uniform float uTime; uniform float uPR; attribute float aSeed; varying float vA; varying float vS;',
        'void main(){',
        '  vec3 p = position;',
        '  p.y = mod(p.y + uTime*(0.12 + aSeed*0.22), 10.0) - 2.4;',
        '  p.x += sin(uTime*0.3 + aSeed*20.0)*0.4;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '  gl_PointSize = (1.6 + aSeed*2.6) * uPR * (10.0 / -mv.z);',
        '  vA = smoothstep(-2.4, -1.0, p.y) * (1.0 - smoothstep(5.0, 7.6, p.y));',
        '  vS = aSeed;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uIntro; varying float vA; varying float vS;',
        'void main(){',
        '  vec3 teal = vec3(0.122, 0.655, 0.624); vec3 silver = vec3(0.62, 0.70, 0.76);',
        '  gl_FragColor = vec4(mix(silver, teal, step(0.55, vS)), vA*0.5*uIntro);',
        '}'
      ].join('\n')
    });
    scene.add(new THREE.Points(dg, dustMat));
    return true;
  }

  var camX, camY;
  function resize() {
    if (!renderer) return;
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = camera.aspect < 0.8 ? 68 : 50;
    camera.updateProjectionMatrix();
    floorMat.uniforms.uPR.value = dustMat.uniforms.uPR.value = renderer.getPixelRatio();
  }

  var raycaster, ndc, plane, hit;
  function trackPointer() {
    raycaster = new THREE.Raycaster(); ndc = new THREE.Vector2();
    plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -FLOOR_Y); hit = new THREE.Vector3();
    window.addEventListener('pointermove', function (e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      pointer.active = true; pointer.t = performance.now();
      if (camX) { camX(pointer.x * 0.7); camY(1.6 + pointer.y * 0.25); }
    }, { passive: true });
  }

  var clock = new THREE.Clock();
  function frame() {
    var t = clock.getElapsedTime();
    floorMat.uniforms.uTime.value = t;
    dustMat.uniforms.uTime.value = t;
    floorMat.uniforms.uIntro.value = dustMat.uniforms.uIntro.value = intro.v;

    if (pointer.active && performance.now() - pointer.t < 4000) {
      ndc.set(pointer.x, pointer.y);
      raycaster.setFromCamera(ndc, camera);
      if (raycaster.ray.intersectPlane(plane, hit)) mouseTarget.set(hit.x, hit.z);
    } else {
      mouseTarget.set(Math.sin(t * 0.32) * 9, -7 + Math.cos(t * 0.21) * 4);
    }
    mouseFloor.lerp(mouseTarget, 0.07);

    camera.lookAt(0, 3.2, -12);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  if (libsOk && initScene()) {
    resize();
    window.addEventListener('resize', resize);
    if (animate) {
      camX = gsap.quickTo(camera.position, 'x', { duration: 1.4, ease: 'power3.out' });
      camY = gsap.quickTo(camera.position, 'y', { duration: 1.4, ease: 'power3.out' });
      trackPointer();
      frame();
    } else {
      /* reduced motion: one calm static frame */
      floorMat.uniforms.uTime.value = 2.0; dustMat.uniforms.uTime.value = 2.0;
      camera.lookAt(0, 3.2, -12);
      renderer.render(scene, camera);
      window.addEventListener('resize', function () { camera.lookAt(0, 3.2, -12); renderer.render(scene, camera); });
    }
  }

  /* ======================= GSAP master timeline ======================= */
  if (animate) {
    var logo = $('#logo'), scan = $('#scan');
    var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    tl.to(intro, { v: 1, duration: 2.6, ease: 'power2.inOut' }, 0)
      .to(camera.position, { z: 9, duration: 3.2, ease: 'power3.out' }, 0)
      .set(scan, { opacity: 1, left: '0%' }, 0.3)
      .to(logo, { clipPath: 'inset(0 0% 0 0)', duration: 1.7, ease: 'power3.inOut' }, 0.3)
      .to(scan, { left: '100%', duration: 1.7, ease: 'power3.inOut' }, 0.3)
      .to(scan, { opacity: 0, duration: 0.35 }, 1.75)
      .set(logo, { clearProps: 'clipPath' }, 2.05)
      .add(function () {
        anime({
          targets: '#headline .ch',
          translateY: ['0.7em', 0], opacity: [0, 1], rotate: ['6deg', 0],
          delay: anime.stagger(24), duration: 900, easing: 'easeOutExpo'
        });
      }, 1.5)
      .to('.reveal', { opacity: 1, y: 0, duration: 0.9, stagger: 0.14, clearProps: 'transform' }, 2.0)
      .add(function () {
        var path = $('#signal-path');
        anime({ targets: path, strokeDashoffset: [anime.setDashoffset, 0], duration: 1800, easing: 'easeInOutSine' });
      }, 2.3);
  }
})();
</script>
</body>
</html>
